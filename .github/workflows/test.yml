name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # 1. CLI smoke：能正常打印 help / version
      - name: CLI smoke test
        run: |
          node bin/atlas.js --version
          node bin/atlas.js --help

      # 2. landing page demo（file:// 协议，连服务都不需要）
      - name: Landing demo
        run: node tests/landing-demo.spec.js

      # 3. 端到端：模拟全新机器 npx 安装 + 首次引导 + 启动
      - name: End-to-end install
        run: |
          npm pack
          node tests/e2e-install.spec.js

      # 4. 其余全部 spec：每个都用 tests/helpers/isolated-atlas.js 自起隔离实例
      #    （独立 ATLAS_HOME + 临时扫描根 + 临时 fixture + 随机端口，结束即删），
      #    所以这里不再需要预置 fixture、也不需要起共享服务。
      #    dir-picker 例外：它测的是"列真实文件系统目录"的 /api/browse，
      #    断言依赖 home 下有非隐藏子目录，CI runner 的 home 结构不保证，故不在 CI 跑。
      - name: Isolated specs
        run: |
          set -e
          for spec in \
            preview-live-edit \
            favorites-and-tags \
            archive-and-collapse-all \
            toast \
            inline-edit \
            v0.2-features \
            sse-leak-and-retry \
            click-with-jitter \
            folder-toggle-with-jitter \
            no-sortable-leak \
            drag-hover-expand \
            drag-stress \
            drag-to-root \
            search-cn-and-highlight \
            sidebar \
            scroll-stuck \
            scroll-after-toggle
          do
            echo "===== $spec ====="
            node "tests/$spec.spec.js"
          done

      # 帧率门槛在共享 CI runner 上波动大（无 GPU、邻居噪声），只做非阻塞观测
      - name: Sidebar perf (non-blocking)
        continue-on-error: true
        run: node tests/sidebar-perf.spec.js
