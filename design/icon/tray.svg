<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- macOS template image: only the alpha channel matters. -->
  <!-- Build the glyph with a mask so text lines and the gap between -->
  <!-- the two sheets become transparent (menu-bar color shows through). -->
  <mask id="doc">
    <!-- white = opaque (renders as the template's black/white) -->
    <rect x="10.5" y="5" width="14.5" height="18" rx="2.6" fill="#fff"/>
    <rect x="6" y="9" width="14.5" height="18" rx="2.6" fill="#fff"/>
    <!-- black = knockout: a thin gap that separates the front sheet -->
    <rect x="6" y="9" width="14.5" height="18" rx="2.6"
          fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- black = knockout: text lines on the front sheet -->
    <g fill="#000">
      <rect x="8.8" y="14.4" width="9" height="1.9" rx="0.95"/>
      <rect x="8.8" y="18"   width="9" height="1.9" rx="0.95"/>
      <rect x="8.8" y="21.6" width="5.8" height="1.9" rx="0.95"/>
    </g>
  </mask>
  <rect width="32" height="32" fill="#000" mask="url(#doc)"/>
</svg>
