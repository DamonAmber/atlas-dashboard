<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b9cff"/>
      <stop offset="100%" stop-color="#8b5bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2b5e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- one card peeking behind (implies a collection) -->
  <g filter="url(#sh)">
    <rect x="392" y="262" width="330" height="450" rx="36" fill="#ffffff" opacity="0.42"
          transform="rotate(7 512 512)"/>
    <!-- front page with folded corner -->
    <path d="M320 286
             h258 l104 104
             v304 a36 36 0 0 1 -36 36
             h-326 a36 36 0 0 1 -36 -36
             v-372 a36 36 0 0 1 36 -36 z" fill="#ffffff"/>
    <!-- folded corner -->
    <path d="M578 286 l104 104 h-86 a18 18 0 0 1 -18 -18 z" fill="#d5def2"/>
  </g>

  <!-- text lines -->
  <g fill="#b9c8e8">
    <rect x="366" y="452" width="200" height="26" rx="13"/>
    <rect x="366" y="508" width="270" height="26" rx="13"/>
    <rect x="366" y="564" width="230" height="26" rx="13"/>
    <rect x="366" y="620" width="270" height="26" rx="13"/>
  </g>

  <!-- unread red dot badge -->
  <circle cx="672" cy="300" r="54" fill="#ffffff"/>
  <circle cx="672" cy="300" r="39" fill="#ff4d4f"/>
</svg>
