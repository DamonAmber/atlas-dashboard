<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b9cff"/>
      <stop offset="100%" stop-color="#8b5bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1a2b5e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle background (macOS 1024 grid: 824x824 inset, r=185) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- fanned document cards: many docs gathered in one place -->
  <g filter="url(#sh)">
    <rect x="300" y="300" width="360" height="470" rx="34" fill="#ffffff" opacity="0.4"
          transform="rotate(-11 512 512)"/>
    <rect x="364" y="290" width="360" height="470" rx="34" fill="#ffffff" opacity="0.65"
          transform="rotate(9 512 512)"/>
    <rect x="332" y="300" width="360" height="470" rx="34" fill="#ffffff"/>
  </g>

  <!-- text lines on front card -->
  <g fill="#b9c8e8">
    <rect x="372" y="372" width="210" height="26" rx="13"/>
    <rect x="372" y="428" width="280" height="26" rx="13"/>
    <rect x="372" y="484" width="240" height="26" rx="13"/>
    <rect x="372" y="540" width="280" height="26" rx="13"/>
    <rect x="372" y="596" width="170" height="26" rx="13"/>
  </g>

  <!-- unread red dot: Atlas flags AI-updated docs -->
  <circle cx="690" cy="322" r="52" fill="#ffffff"/>
  <circle cx="690" cy="322" r="38" fill="#ff4d4f"/>
</svg>
