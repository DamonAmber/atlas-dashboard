<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b9cff"/>
      <stop offset="100%" stop-color="#8b5bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1a2b5e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- dashboard grid of doc tiles -->
  <g filter="url(#sh)">
    <!-- top-left: mini doc with lines -->
    <rect x="300" y="300" width="190" height="190" rx="30" fill="#ffffff"/>
    <!-- top-right: unread doc -->
    <rect x="534" y="300" width="190" height="190" rx="30" fill="#ffffff"/>
    <!-- bottom-left -->
    <rect x="300" y="534" width="190" height="190" rx="30" fill="#ffffff" opacity="0.85"/>
    <!-- bottom-right -->
    <rect x="534" y="534" width="190" height="190" rx="30" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- text lines inside tiles -->
  <g fill="#b9c8e8">
    <rect x="330" y="342" width="110" height="18" rx="9"/>
    <rect x="330" y="378" width="130" height="18" rx="9"/>
    <rect x="330" y="414" width="90" height="18" rx="9"/>

    <rect x="564" y="342" width="110" height="18" rx="9"/>
    <rect x="564" y="378" width="130" height="18" rx="9"/>

    <rect x="330" y="576" width="110" height="18" rx="9"/>
    <rect x="330" y="612" width="90" height="18" rx="9"/>
    <rect x="330" y="648" width="120" height="18" rx="9"/>

    <rect x="564" y="576" width="120" height="18" rx="9"/>
    <rect x="564" y="612" width="90" height="18" rx="9"/>
  </g>

  <!-- unread red dot on top-right tile -->
  <circle cx="724" cy="300" r="46" fill="#ffffff"/>
  <circle cx="724" cy="300" r="33" fill="#ff4d4f"/>
</svg>
